version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: arena
      MONGO_INITDB_ROOT_PASSWORD: arena
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - apps/api/.env.example
    depends_on:
      - mongo
      - redis
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file:
      - apps/web/.env.example
    depends_on:
      - api
    ports:
      - '5173:80'

  nginx:
    image: nginx:1.27-alpine
    profiles: ['edge']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - web
      - api

volumes:
  mongo_data:
